name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v6

      - name: PHPをセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Laravel環境ファイルを準備
        run: cp .env.example .env

      - name: Composer依存パッケージをインストール
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: APP_KEYを生成
        run: php artisan key:generate

      - name: Laravelテストを実行
        run: php artisan test

      - name: Pintを実行
        run: ./vendor/bin/pint --test

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: npm依存パッケージをインストール
        run: npm ci

      - name: Viteビルドを実行
        run: npm run build
